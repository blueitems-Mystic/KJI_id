    // --- FloatingRichTextToolbar (index.html과 동일 — 에디터에서만 마운트) ---
    function FloatingRichTextToolbar() {
      const [state, setState] = React.useState({ visible: false, top: 0, left: 0 });
      const [linkMode, setLinkMode] = React.useState(false);
      const [linkUrl, setLinkUrl] = React.useState("");
      const savedRangeRef = React.useRef(null);

      React.useEffect(() => {
        const onSelectionChange = () => {
          const sel = document.getSelection();
          if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
            setState(prev => prev.visible ? { visible: false, top: 0, left: 0 } : prev);
            setLinkMode(false);
            return;
          }
          const range = sel.getRangeAt(0);
          const anchor = sel.anchorNode && (sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement);
          if (!anchor || !anchor.closest("[contenteditable='true']")) {
            setState(prev => prev.visible ? { visible: false, top: 0, left: 0 } : prev);
            return;
          }
          const rect = range.getBoundingClientRect();
          if (rect.width === 0 && rect.height === 0) return;
          savedRangeRef.current = range.cloneRange();
          setState({
            visible: true,
            top: rect.top - 40,
            left: rect.left + rect.width / 2 - 60,
          });
        };
        document.addEventListener("selectionchange", onSelectionChange);
        return () => document.removeEventListener("selectionchange", onSelectionChange);
      }, []);

      React.useEffect(() => {
        const onKey = (e) => {
          if (!state.visible && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("[contenteditable='true']"))) return;
          if (!(e.ctrlKey || e.metaKey)) return;
          if (e.key.toLowerCase() === "b") { e.preventDefault(); captureCurrentRange(); document.execCommand("bold"); }
          if (e.key.toLowerCase() === "i") { e.preventDefault(); captureCurrentRange(); document.execCommand("italic"); }
          if (e.key.toLowerCase() === "k") { e.preventDefault(); captureCurrentRange(); openLinkMode(); }
        };
        document.addEventListener("keydown", onKey);
        return () => document.removeEventListener("keydown", onKey);
      }, [state.visible]);

      const restoreSelection = () => {
        const sel = document.getSelection();
        if (savedRangeRef.current && sel) {
          sel.removeAllRanges();
          sel.addRange(savedRangeRef.current);
        }
      };

      const captureCurrentRange = () => {
        const sel = document.getSelection();
        if (sel && sel.rangeCount > 0) {
          savedRangeRef.current = sel.getRangeAt(0).cloneRange();
        }
      };

      const openLinkMode = () => {
        setLinkMode(true);
        setLinkUrl("");
      };
      const applyLink = () => {
        restoreSelection();
        if (linkUrl) {
          document.execCommand("createLink", false, linkUrl);
          const sel = document.getSelection();
          if (sel && sel.anchorNode) {
            const a = sel.anchorNode.parentElement && sel.anchorNode.parentElement.closest("a");
            if (a && linkUrl.match(/^https?:/)) {
              a.setAttribute("target", "_blank");
              a.setAttribute("rel", "noopener noreferrer");
            }
          }
        }
        setLinkMode(false);
        const active = document.activeElement;
        if (active && typeof active.blur === "function") active.blur();
      };

      if (!state.visible) return null;

      return (
        <div
          className="floating-rich-toolbar"
          style={{ top: state.top, left: state.left }}
          onMouseDown={(e) => e.preventDefault()}
        >
          {linkMode ? (
            <div className="link-input">
              <input
                autoFocus
                type="url"
                placeholder="https://..."
                value={linkUrl}
                onChange={(e) => setLinkUrl(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") { e.preventDefault(); applyLink(); }
                  if (e.key === "Escape") { e.preventDefault(); setLinkMode(false); }
                }}
              />
              <button onClick={applyLink}>OK</button>
            </div>
          ) : (
            <React.Fragment>
              <button onClick={() => { captureCurrentRange(); document.execCommand("bold"); }} title="Bold (Ctrl+B)">B</button>
              <button onClick={() => { captureCurrentRange(); document.execCommand("italic"); }} title="Italic (Ctrl+I)"><i>I</i></button>
              <button onClick={() => { captureCurrentRange(); openLinkMode(); }} title="Link (Ctrl+K)">🔗</button>
            </React.Fragment>
          )}
        </div>
      );
    }

    // --- PostBlocksEditor (index.html EditableSection의 blocks 전용 적응판) ---
    // onBlocksChange(fn): fn(blocks) => nextBlocks — 부모가 dirty 마킹 담당
    function PostBlocksEditor({ blocks, onBlocksChange, token }) {
      const [pickerAt, setPickerAt] = React.useState(null);
      const [settingsIdx, setSettingsIdx] = React.useState(null);

      const moveBlock = (idx, delta) => {
        onBlocksChange(prev => {
          const j = idx + delta;
          if (j < 0 || j >= prev.length) return prev;
          const next = prev.slice();
          [next[idx], next[j]] = [next[j], next[idx]];
          return next;
        });
      };
      const deleteBlock = (idx) => {
        onBlocksChange(prev => prev.filter((_, i) => i !== idx));
        setSettingsIdx(null);
      };
      const updateBlockAt = (idx, updated) => {
        onBlocksChange(prev => prev.map((b, i) => i === idx ? updated : b));
      };
      const insertBlockAt = (idx, type) => {
        const newBlock = createEmptyBlock(type);
        onBlocksChange(prev => [...prev.slice(0, idx), newBlock, ...prev.slice(idx)]);
        setPickerAt(null);
      };

      const closePicker = React.useCallback(() => setPickerAt(null), []);
      const closeSettings = React.useCallback(() => setSettingsIdx(null), []);

      const renderSettingsPanel = () => {
        if (settingsIdx === null) return null;
        const block = blocks[settingsIdx];
        if (!block) return null;
        const onBlockChange = (updated) => updateBlockAt(settingsIdx, updated);
        switch (block.type) {
          case "image":    return <ImageBlockEdit    block={block} onChange={onBlockChange} token={token} onClose={closeSettings} />;
          case "youtube":  return <YoutubeBlockEdit  block={block} onChange={onBlockChange} token={token} onClose={closeSettings} />;
          case "button":   return <ButtonBlockEdit   block={block} onChange={onBlockChange}               onClose={closeSettings} />;
          case "cardgrid": return <CardgridBlockEdit block={block} onChange={onBlockChange} token={token} onClose={closeSettings} />;
          case "heading":  return <HeadingBlockEdit  block={block} onChange={onBlockChange}               onClose={closeSettings} />;
          case "list":     return <ListBlockEdit     block={block} onChange={onBlockChange}               onClose={closeSettings} />;
          default:
            return (
              <SettingsPanel title={`${block.type} Block`} onClose={closeSettings}>
                <div style={{ fontSize: "0.85rem", color: "#a2a2a2" }}>
                  text 블록은 본문 직접 클릭으로 편집합니다. (드래그 선택 시 B / I / 링크 툴바)
                </div>
              </SettingsPanel>
            );
        }
      };

      return (
        <React.Fragment>
          <BlockInsertGap onInsert={() => setPickerAt(0)} />
          {blocks.map((block, idx) => (
            <React.Fragment key={block.id}>
              <BlockEditWrapper
                index={idx}
                lastIndex={blocks.length - 1}
                onMoveUp={() => moveBlock(idx, -1)}
                onMoveDown={() => moveBlock(idx, +1)}
                onDelete={() => deleteBlock(idx)}
                onSettings={() => setSettingsIdx(idx)}
              >
                <EditableBlockContent
                  block={block}
                  onChange={(updated) => updateBlockAt(idx, updated)}
                />
              </BlockEditWrapper>
              <BlockInsertGap onInsert={() => setPickerAt(idx + 1)} />
            </React.Fragment>
          ))}
          {blocks.length === 0 && (
            <div className="text-center text-gray-400 py-8" style={{ fontSize: "0.9rem" }}>
              블록이 없습니다 — 위 + 버튼으로 추가하세요.
            </div>
          )}
          {pickerAt !== null && (
            <BlockTypePicker
              onPick={(type) => insertBlockAt(pickerAt, type)}
              onCancel={closePicker}
            />
          )}
          {renderSettingsPanel()}
        </React.Fragment>
      );
    }

    // --- PostEditorView (state 기반 — 라우트 아님) ---
    // postId: null = 신규. 자동저장 없음 — SAVE / SAVE & PUBLISH 명시 버튼만.
    function PostEditorView({ postId, onExit }) {
      const toast = useToast();
      const token = sessionStorage.getItem("admin_token");

      const EMPTY_POST = {
        title: "", titleEmoji: null, subtitle: "", excerpt: "",
        coverImage: null, status: "draft", blocks: [],
      };

      const [post, setPost] = React.useState(postId ? null : EMPTY_POST);
      const [savedId, setSavedId] = React.useState(postId || null);
      const [featured, setFeatured] = React.useState(false);
      const [dirty, setDirty] = React.useState(false);
      const [saving, setSaving] = React.useState(false);
      const [loadError, setLoadError] = React.useState(false);
      const [coverUploading, setCoverUploading] = React.useState(false);
      const coverFileRef = React.useRef(null);

      // 기존 포스트 로드 + featuredId 확인 (인덱스에서)
      React.useEffect(() => {
        if (!postId) return;
        let cancelled = false;
        Promise.all([
          api("/api/posts/" + encodeURIComponent(postId)),
          api("/api/admin/posts"),
        ]).then(([postRes, indexRes]) => {
          if (cancelled) return;
          if (!postRes.ok || !Array.isArray(postRes.data.blocks)) {
            setLoadError(true);
            return;
          }
          setPost(postRes.data);
          if (indexRes.ok && indexRes.data.featuredId === postId) {
            setFeatured(true);
          }
        }).catch(() => {
          if (!cancelled) setLoadError(true);
        });
        return () => { cancelled = true; };
      }, [postId]);

      // dirty 시 이탈 가드
      React.useEffect(() => {
        if (!dirty) return;
        const handler = (e) => {
          e.preventDefault();
          e.returnValue = '';
        };
        window.addEventListener("beforeunload", handler);
        return () => window.removeEventListener("beforeunload", handler);
      }, [dirty]);

      const mutate = (updater) => {
        setPost(prev => updater(prev));
        setDirty(true);
      };
      const setMeta = (patch) => mutate(prev => ({ ...prev, ...patch }));

      const handleCoverFile = async (file) => {
        if (!file || coverUploading) return;
        setCoverUploading(true);
        try {
          const data = await uploadPortfolioImage(token, file);
          setMeta({ coverImage: data.url });
        } catch (e) {
          toast.error("커버 업로드 실패", e.message);
        } finally {
          setCoverUploading(false);
        }
      };

      // setSaving은 비동기 반영이라 빠른 더블클릭 시 중복 POST 가능 — ref로 동기 가드
      const savingRef = React.useRef(false);
      const doSave = (publish) => {
        if (savingRef.current) return;
        if (!post.title || !post.title.trim()) {
          toast.warning("저장 불가", "제목을 입력하세요.");
          return;
        }
        const status = publish ? "published" : (post.status || "draft");
        const body = {
          title: post.title,
          titleEmoji: post.titleEmoji || null,
          subtitle: post.subtitle || "",
          excerpt: post.excerpt || "",
          coverImage: post.coverImage || null,
          status,
          featured: status === "published" ? featured : false,
          blocks: post.blocks,
        };
        savingRef.current = true;
        setSaving(true);
        const req = savedId
          ? api("/api/posts/" + encodeURIComponent(savedId), { method: "PUT", json: body })
          : api("/api/posts", { method: "POST", json: body });
        req.then(({ ok, status: code, data }) => {
          savingRef.current = false;
          setSaving(false);
          if (!ok) {
            toast.error(
              "저장 실패",
              code === 401 ? "인증 실패 — 다시 로그인하세요 (?admin=1 재진입)" : (data.error || `HTTP ${code}`)
            );
            return;
          }
          setSavedId(data.id);
          setPost(prev => ({ ...prev, status: data.status, publishedAt: data.publishedAt }));
          setDirty(false);
          toast.success("저장 완료", "반영까지 최대 1분 소요 (KV 캐시 전파)");
        }).catch(() => {
          savingRef.current = false;
          setSaving(false);
          toast.error("저장 실패", "서버 연결 실패");
        });
      };

      const handleExit = () => {
        if (dirty && !window.confirm("저장하지 않은 변경이 있습니다. 나갈까요?")) return;
        onExit();
      };

      if (loadError) {
        return (
          <div className="os-window">
            <div className="os-header">
              <span className="os-header-title">ERROR.SYS</span>
              <div className="os-header-squares">
                <div className="os-square y"></div>
                <div className="os-square g"></div>
                <div className="os-square r"></div>
              </div>
            </div>
            <div className="os-body text-center py-16">
              <p className="pixel-font text-gray-400 mb-8">POST LOAD FAILED</p>
              <button className="btn-pixel" onClick={onExit}>
                <span className="btn-pixel-text">&larr; BACK</span>
              </button>
            </div>
          </div>
        );
      }

      if (!post) {
        return (
          <div className="text-center py-20">
            <span className="pixel-font text-gray-400">LOADING...</span>
          </div>
        );
      }

      const isPublished = post.status === "published";

      return (
        <React.Fragment>
          <div className="editor-toolbar">
            <button className="exit" onClick={handleExit}>EXIT</button>
            <span className={"status" + (dirty ? " dirty" : "")}>
              {saving ? "SAVING..." : dirty ? "● UNSAVED" : savedId ? `[${post.status.toUpperCase()}] ${savedId}` : "[NEW]"}
            </span>
            <label
              className={"featured-toggle" + (isPublished ? "" : " disabled")}
              title={isPublished ? "메인 페이지 노출 지정" : "published 상태에서만 지정 가능"}
            >
              <input
                type="checkbox"
                checked={featured}
                disabled={!isPublished}
                onChange={(e) => { setFeatured(e.target.checked); setDirty(true); }}
              />
              FEATURED
            </label>
            <button onClick={() => doSave(false)} disabled={saving}>SAVE</button>
            <button onClick={() => doSave(true)} disabled={saving}>SAVE &amp; PUBLISH</button>
          </div>

          <div className="os-window editor-meta">
            <div className="os-header">
              <span className="os-header-title">POST_META.SYS</span>
              <div className="os-header-squares">
                <div className="os-square y"></div>
                <div className="os-square g"></div>
                <div className="os-square r"></div>
              </div>
            </div>
            <div className="os-body">
              <label>제목 *</label>
              <input
                type="text"
                value={post.title || ""}
                onChange={(e) => setMeta({ title: e.target.value })}
                placeholder="포스트 제목"
              />
              <label>제목 이모지 (선택)</label>
              <input
                type="text"
                value={post.titleEmoji || ""}
                onChange={(e) => setMeta({ titleEmoji: e.target.value || null })}
                placeholder="🏝️"
              />
              <label>부제 (선택)</label>
              <input
                type="text"
                value={post.subtitle || ""}
                onChange={(e) => setMeta({ subtitle: e.target.value })}
                placeholder="한 줄 부제"
              />
              <label>요약 (목록 카드에 표시)</label>
              <textarea
                rows={2}
                value={post.excerpt || ""}
                onChange={(e) => setMeta({ excerpt: e.target.value })}
                placeholder="목록에서 보이는 짧은 요약"
              />
              <label>커버 이미지 (선택 — 목록 카드 상단)</label>
              <input
                type="text"
                value={post.coverImage || ""}
                onChange={(e) => setMeta({ coverImage: e.target.value || null })}
                placeholder="Cloudinary URL 또는 아래 업로드"
              />
              <button
                className="cover-upload-btn"
                disabled={coverUploading}
                onClick={() => coverFileRef.current && coverFileRef.current.click()}
              >
                {coverUploading ? "업로드 중..." : "📤 커버 이미지 업로드"}
              </button>
              <input
                ref={coverFileRef}
                type="file"
                accept="image/*"
                style={{ display: "none" }}
                onChange={(e) => handleCoverFile(e.target.files && e.target.files[0])}
              />
              {post.coverImage && (
                <div style={{ marginTop: 12 }}>
                  <img src={post.coverImage} alt="" style={{ maxWidth: "100%", maxHeight: 180, borderRadius: 2 }} />
                </div>
              )}
            </div>
          </div>

          <div className="os-window">
            <div className="os-header">
              <span className="os-header-title">POST_BODY.SYS</span>
              <div className="os-header-squares">
                <div className="os-square y"></div>
                <div className="os-square g"></div>
                <div className="os-square r"></div>
              </div>
            </div>
            <div className="os-body">
              <PostBlocksEditor
                blocks={post.blocks}
                onBlocksChange={(fn) => mutate(prev => ({ ...prev, blocks: fn(prev.blocks) }))}
                token={token}
              />
            </div>
          </div>

          <FloatingRichTextToolbar />
        </React.Fragment>
      );
    }

    // === Status Bar (index.html StatusBar 축소판) ===
    function ProjectStatusBar({ theme, toggleTheme, isCrt, toggleCrt }) {
      return (
        <div className="status-bar pixel-font w-full">
          <div className="flex items-center" style={{ position: "relative", zIndex: 2 }}>
            <nav className="flex gap-3 sm:gap-4 text-[9px] sm:text-[10px]">
              <a href="index.html" className="hover:text-yellow-400">&larr; PORTFOLIO</a>
              <a href="gallery.html" className="hover:text-yellow-400">GALLERY</a>
            </nav>
          </div>
          <span className="statusbar-title hidden sm:block text-[10px]">PROJECT_LOG</span>
          <div className="flex items-center">
            <button
              className="pwr-btn-top theme-toggle pixel-font"
              onClick={toggleTheme}
              title="Theme Toggle"
            >{theme === 'dark' ? 'DARK' : 'LIGHT'}</button>
            <button
              className={`pwr-btn-top pixel-font${isCrt ? '' : ' off'}`}
              onClick={toggleCrt}
              title="Scanline Toggle"
            >SCN</button>
          </div>
        </div>
      );
    }

    // === Post Card (목록 항목 — adminMode 시 액션 버튼 노출) ===
    function PostCard({ meta, isFeatured, adminMode, onEdit, onDelete, onSetFeatured, busy }) {
      const date = fmtDate(meta.publishedAt || meta.createdAt);
      const isDraft = meta.status === "draft";
      const open = () => { window.location.hash = "#/post/" + encodeURIComponent(meta.id); };
      return (
        <div
          className="os-window post-card"
          onClick={open}
          role="link"
          tabIndex={0}
          onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } }}
        >
          <div className="os-header">
            <span className="os-header-title">{date ? `${date}.LOG` : "LOG"}</span>
            <div className="os-header-squares">
              <div className="os-square y"></div>
              <div className="os-square g"></div>
              <div className="os-square r"></div>
            </div>
          </div>
          {meta.coverImage && (
            <img className="post-cover" src={meta.coverImage} alt={meta.title || ""} loading="lazy" />
          )}
          <div className="os-body">
            <h2 className="pixel-font text-lg md:text-xl rpg-title flex items-center gap-3 flex-wrap">
              {meta.titleEmoji && <span>{meta.titleEmoji}</span>}
              <span>{meta.title}</span>
              {isFeatured && <span className="featured-badge">&#9733; FEATURED</span>}
              {adminMode && isDraft && <span className="draft-badge">DRAFT</span>}
            </h2>
            {meta.subtitle && (
              <p className="text-lg mb-4 text-blue-200 font-bold">{meta.subtitle}</p>
            )}
            {meta.excerpt && (
              <p className="text-gray-400 text-base">{meta.excerpt}</p>
            )}
            {adminMode && (
              <div
                className="admin-card-actions"
                onClick={(e) => e.stopPropagation()}
                onKeyDown={(e) => e.stopPropagation()}
              >
                <button onClick={onEdit} disabled={busy}>EDIT</button>
                <button className="danger" onClick={onDelete} disabled={busy}>DELETE</button>
                {!isDraft && !isFeatured && (
                  <button onClick={onSetFeatured} disabled={busy}>SET FEATURED</button>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // === 목록 뷰 (adminMode 시 /api/admin/posts — draft 포함 + 관리 액션) ===
    function PostListView({ adminMode, onEdit, onNew }) {
      const toast = useToast();
      const [state, setState] = React.useState({ loading: true, error: false, featuredId: null, posts: [] });
      const [reloadTick, setReloadTick] = React.useState(0);
      const [busy, setBusy] = React.useState(false);
      const reload = () => setReloadTick(n => n + 1);

      React.useEffect(() => {
        let cancelled = false;
        api(adminMode ? "/api/admin/posts" : "/api/posts")
          .then(({ ok, data }) => {
            if (cancelled) return;
            if (!ok || !Array.isArray(data.posts)) {
              setState({ loading: false, error: true, featuredId: null, posts: [] });
              return;
            }
            setState({ loading: false, error: false, featuredId: data.featuredId || null, posts: data.posts });
          })
          .catch(() => {
            if (!cancelled) setState({ loading: false, error: true, featuredId: null, posts: [] });
          });
        return () => { cancelled = true; };
      }, [adminMode, reloadTick]);

      const handleDelete = (meta) => {
        if (busy) return;
        if (!window.confirm(`"${meta.title}" 포스트를 삭제할까요?\n되돌릴 수 없습니다.`)) return;
        setBusy(true);
        api("/api/posts/" + encodeURIComponent(meta.id), { method: "DELETE" })
          .then(({ ok, status, data }) => {
            setBusy(false);
            if (!ok) {
              toast.error("삭제 실패", status === 401 ? "인증 실패 — 다시 로그인하세요" : (data.error || `HTTP ${status}`));
              return;
            }
            toast.success("삭제 완료", "반영까지 최대 1분 소요 (KV 캐시 전파)");
            reload();
          })
          .catch(() => { setBusy(false); toast.error("삭제 실패", "서버 연결 실패"); });
      };

      // SET FEATURED: 포스트 전문 GET → featured:true 로 PUT → 목록 재로드
      const handleSetFeatured = (meta) => {
        if (busy) return;
        setBusy(true);
        api("/api/posts/" + encodeURIComponent(meta.id))
          .then(({ ok, status, data }) => {
            if (!ok || !Array.isArray(data.blocks)) {
              throw new Error(status === 401 ? "인증 실패" : (data.error || `HTTP ${status}`));
            }
            const body = {
              title: data.title,
              titleEmoji: data.titleEmoji || null,
              subtitle: data.subtitle || "",
              excerpt: data.excerpt || "",
              coverImage: data.coverImage || null,
              status: data.status,
              featured: true,
              blocks: data.blocks,
            };
            return api("/api/posts/" + encodeURIComponent(meta.id), { method: "PUT", json: body });
          })
          .then((res) => {
            setBusy(false);
            if (!res.ok) {
              toast.error("FEATURED 지정 실패", res.data.error || `HTTP ${res.status}`);
              return;
            }
            toast.success("FEATURED 지정 완료", "반영까지 최대 1분 소요 (KV 캐시 전파)");
            reload();
          })
          .catch((e) => { setBusy(false); toast.error("FEATURED 지정 실패", e.message || "서버 연결 실패"); });
      };

      if (state.loading) {
        return (
          <div className="text-center py-20">
            <span className="pixel-font text-gray-400">LOADING...</span>
          </div>
        );
      }

      const newPostRow = adminMode && (
        <div className="admin-new-post-row">
          <button className="btn-pixel" onClick={onNew}>
            <span className="btn-pixel-text">+ NEW POST</span>
          </button>
        </div>
      );

      if (state.error || state.posts.length === 0) {
        return (
          <React.Fragment>
            {newPostRow}
            <div className="os-window">
              <div className="os-header">
                <span className="os-header-title">PROJECT_LOG.SYS</span>
                <div className="os-header-squares">
                  <div className="os-square y"></div>
                  <div className="os-square g"></div>
                  <div className="os-square r"></div>
                </div>
              </div>
              <div className="os-body text-center py-16">
                <p className="pixel-font text-gray-400">{state.error ? "SYSTEM ERROR — RETRY LATER" : "NO LOGS FOUND"}</p>
              </div>
            </div>
          </React.Fragment>
        );
      }

      return (
        <React.Fragment>
          {newPostRow}
          {state.posts.map((meta) => (
            <PostCard
              key={meta.id}
              meta={meta}
              isFeatured={meta.id === state.featuredId}
              adminMode={adminMode}
              busy={busy}
              onEdit={() => onEdit(meta.id)}
              onDelete={() => handleDelete(meta)}
              onSetFeatured={() => handleSetFeatured(meta)}
            />
          ))}
        </React.Fragment>
      );
    }

    // === 상세 뷰 (adminMode 시 EDIT 버튼 — draft도 Bearer로 열람 가능) ===
    function PostDetailView({ id, adminMode, onEdit }) {
      const [state, setState] = React.useState({ loading: true, error: false, post: null });

      React.useEffect(() => {
        let cancelled = false;
        setState({ loading: true, error: false, post: null });
        api("/api/posts/" + encodeURIComponent(id))
          .then(({ ok, data }) => {
            if (cancelled) return;
            if (!ok || !data || !Array.isArray(data.blocks)) {
              setState({ loading: false, error: true, post: null });
              return;
            }
            setState({ loading: false, error: false, post: data });
          })
          .catch(() => {
            if (!cancelled) setState({ loading: false, error: true, post: null });
          });
        return () => { cancelled = true; };
      }, [id]);

      if (state.loading) {
        return (
          <div className="text-center py-20">
            <span className="pixel-font text-gray-400">LOADING...</span>
          </div>
        );
      }

      if (state.error) {
        return (
          <div className="os-window">
            <div className="os-header">
              <span className="os-header-title">ERROR.SYS</span>
              <div className="os-header-squares">
                <div className="os-square y"></div>
                <div className="os-square g"></div>
                <div className="os-square r"></div>
              </div>
            </div>
            <div className="os-body text-center py-16">
              <p className="pixel-font text-gray-400 mb-8">LOG NOT FOUND</p>
              <a href="#/" className="btn-pixel">
                <span className="btn-pixel-text">&larr; ALL POSTS</span>
              </a>
            </div>
          </div>
        );
      }

      const post = state.post;
      const date = fmtDate(post.publishedAt || post.createdAt);
      return (
        <React.Fragment>
          <div className="os-window">
            <div className="os-header">
              <span className="os-header-title">{date ? `${date}.LOG` : "LOG"}</span>
              <div className="os-header-squares">
                <div className="os-square y"></div>
                <div className="os-square g"></div>
                <div className="os-square r"></div>
              </div>
            </div>
            <div className="os-body">
              <h2 className={post.subtitle ? "pixel-font text-xl md:text-2xl rpg-title flex items-center gap-3 flex-wrap" : "pixel-font text-xl md:text-2xl rpg-title"}>
                {post.titleEmoji && <span>{post.titleEmoji}</span>}
                <span>{post.title}</span>
                {adminMode && post.status === "draft" && <span className="draft-badge">DRAFT</span>}
              </h2>
              {post.subtitle && (
                <p className="text-xl mb-2 text-blue-200 font-bold">{post.subtitle}</p>
              )}
              {date && <p className="post-date-line mb-6">LOGGED: {date}</p>}
              {post.blocks.map((b) => <Block key={b.id} block={b} />)}
            </div>
          </div>
          <div className="mb-10 flex flex-wrap gap-4">
            <a href="#/" className="btn-pixel">
              <span className="btn-pixel-text">&larr; ALL POSTS</span>
            </a>
            {adminMode && onEdit && (
              <button className="btn-pixel" onClick={() => onEdit(post.id)}>
                <span className="btn-pixel-text">EDIT</span>
              </button>
            )}
          </div>
        </React.Fragment>
      );
    }

    // === App ===
    function ProjectApp() {
      const route = useHashRoute();

      // Theme (포트폴리오와 localStorage 공유)
      const [theme, setTheme] = React.useState(
        () => localStorage.getItem('portfolio-theme') || 'light'
      );
      React.useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('portfolio-theme', theme);
      }, [theme]);

      // CRT toggle (index.html과 동일 — 기본 on, 세션 내 in-memory)
      const [isCrt, setIsCrt] = React.useState(true);
      React.useEffect(() => {
        const crt = document.getElementById('crt-overlay');
        if (crt) crt.style.display = isCrt ? 'block' : 'none';
      }, [isCrt]);

      // === Admin (gallery.html ?admin=1 패턴 — sessionStorage admin_token 공유) ===
      const [adminMode, setAdminMode] = React.useState(false);
      const [showPasswordModal, setShowPasswordModal] = React.useState(false);
      const [authError, setAuthError] = React.useState('');
      // editor: null = 뷰어 / { id: string|null } = 에디터 (id null = 신규)
      const [editor, setEditor] = React.useState(null);
      const [listRefresh, setListRefresh] = React.useState(0);

      React.useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('admin') !== '1') return;
        const token = sessionStorage.getItem('admin_token');
        if (!token) {
          setShowPasswordModal(true);
          return;
        }
        // 저장된 토큰 검증 (GET /api/admin/posts = 로그인 검증 겸용)
        api('/api/admin/posts')
          .then(({ ok }) => {
            if (ok) {
              setAdminMode(true);
            } else {
              sessionStorage.removeItem('admin_token');
              setShowPasswordModal(true);
            }
          })
          .catch(() => {
            sessionStorage.removeItem('admin_token');
            setShowPasswordModal(true);
          });
      }, []);

      async function handlePasswordSubmit(pw) {
        setAuthError('');
        sessionStorage.setItem('admin_token', pw);
        try {
          const { ok } = await api('/api/admin/posts');
          if (!ok) {
            setAuthError('인증 실패');
            sessionStorage.removeItem('admin_token');
            return;
          }
          setAdminMode(true);
          setShowPasswordModal(false);
        } catch (e) {
          setAuthError('서버 연결 실패');
          sessionStorage.removeItem('admin_token');
        }
      }

      function handlePasswordCancel() {
        setShowPasswordModal(false);
        const url = new URL(window.location);
        url.searchParams.delete('admin');
        window.history.replaceState({}, '', url);
      }

      // 에디터 진입 — 1024px 미만 차단 (index.html 패턴)
      function openEditor(id) {
        if (window.innerWidth < 1024) {
          alert("편집은 1024px 이상 뷰포트에서만 가능합니다.\n데스크톱 브라우저에서 접속해 주세요.");
          return;
        }
        setEditor({ id });
      }
      function closeEditor() {
        setEditor(null);
        setListRefresh(n => n + 1); // 목록 재로드 (저장 결과 반영)
      }

      // 라우트 전환 시 스크롤 최상단
      React.useEffect(() => {
        window.scrollTo(0, 0);
      }, [route.view, route.id]);

      return (
        <React.Fragment>
          <ProjectStatusBar
            theme={theme}
            toggleTheme={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
            isCrt={isCrt}
            toggleCrt={() => setIsCrt(v => !v)}
          />
          <div style={{ maxWidth: "900px", position: "relative", zIndex: 10 }} className="mx-auto p-4 sm:p-8 pt-8 sm:pt-10">
            {adminMode && editor ? (
              <PostEditorView
                key={editor.id || "new"}
                postId={editor.id}
                onExit={closeEditor}
              />
            ) : route.view === "post" ? (
              <PostDetailView id={route.id} adminMode={adminMode} onEdit={openEditor} />
            ) : (
              <PostListView
                key={listRefresh}
                adminMode={adminMode}
                onEdit={openEditor}
                onNew={() => openEditor(null)}
              />
            )}
            <footer className="text-center text-gray-500 text-sm mt-12 mb-8 pixel-font">
              &copy; 2026 Kim Jong-il. All rights reserved.
            </footer>
          </div>
          {showPasswordModal && (
            <PasswordModal
              onSubmit={handlePasswordSubmit}
              onCancel={handlePasswordCancel}
              error={authError}
            />
          )}
        </React.Fragment>
      );
    }

    ReactDOM.render(
      <ToastProvider>
        <ProjectApp />
      </ToastProvider>,
      document.getElementById('root')
    );
  </script>
</body>
</html>
