<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수작업 프로젝트 · 김종일 컨셉아트</title>
<meta name="description" content="김종일이 AI 없이 직접 그린 프로젝트 컨셉아트. 최신 작업부터 순서대로.">
<meta property="og:type" content="website">
<meta property="og:title" content="수작업 프로젝트 · 김종일 컨셉아트">
<meta property="og:image" content="https://res.cloudinary.com/duwi0pqm2/image/upload/c_limit,w_1200,q_auto,f_jpg/03_z7ncne">
<meta property="og:url" content="https://kji.blueitems.net/works/manual/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../kji-buttons.css">
<style>
  /* works 허브·작업 페이지와 같은 보드 팔레트 */
  :root {
    --canvas: #46484b;
    --deep: #3a3c3f;
    --ink: #e6e4df;
    --ink-soft: #b9b7b2;
    --rule: #6d6f72;
    --serif: 'Gowun Batang', 'IBM Plex Sans KR', serif;
    --sans: 'IBM Plex Sans KR', 'Gowun Dodum', sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 16px/1.7 var(--sans); word-break: keep-all; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
  .back { padding-top: 14px; padding-bottom: 14px; font-size: 15px; }
  .back a { text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 2px; }
  .back a + a { margin-left: 24px; border-bottom: 0; color: var(--ink-soft); }
  .intro { padding-top: 40px; padding-bottom: 72px; }
  h1 { margin: 0 0 14px; font: 700 clamp(34px, 5vw, 56px)/1.2 var(--serif); }
  .intro p { margin: 0; max-width: 42em; color: var(--ink-soft); font-size: 17px; }

  .actions { margin-top: 28px; }

  /* 게시물: 제목·연도 → 이미지 전부 가로 폭에 맞춤, 세로는 원본 비율 */
  .arc + .arc { margin-top: clamp(80px, 10vw, 128px); }
  .arc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin: 0 0 20px; }
  .arc-head h2 { font: 700 clamp(24px, 3vw, 32px)/1.3 var(--serif); margin: 0; }
  .arc-meta { margin: 0; color: var(--ink-soft); font-size: 15px; }
  .arc a { display: block; cursor: zoom-in; background: var(--deep); }
  .arc a + a { margin-top: 16px; }
  .arc img { display: block; width: 100%; height: auto; }
  .status { color: var(--ink-soft); }

  .note { margin-top: 112px; padding-bottom: 24px; color: var(--ink-soft); font-size: 14px; }
  .note .rule { border-top: 1px solid var(--rule); padding-top: 24px; }
  .note p { margin: 0 0 6px; }
  .back.bottom { padding-bottom: 48px; }

  /* 크게 보기 */
  .lb { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: rgba(40,41,43,.97); color: var(--ink); }
  .lb::backdrop { background: transparent; }
  .lb-stage { position: absolute; inset: 0 0 56px 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: var(--ink-soft); }
  .lb-bar button { font: inherit; color: inherit; background: none; border: 1px solid var(--rule); border-radius: 2px; padding: 4px 16px; cursor: pointer; }
  .lb-bar button:hover { border-color: var(--ink-soft); }
  .lb-count { min-width: 5.5em; text-align: center; }
  .lb-title { position: absolute; left: 20px; max-width: 30%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lb-close { position: absolute; right: 20px; }

  /* 작업 목차: ≥1500px = 본문 옆 고정 목차, 그 아래 = 상단 고정 바 / 둘 다 "전체 보기" */
  :root { --tocw: clamp(260px, 18vw, 340px); }
  .arc.flash .arc-head h2 { animation: flash 1.4s ease-out; }
  @keyframes flash { 0%, 30% { color: #fff; text-shadow: 0 0 12px rgba(255,255,255,.35); } 100% { color: inherit; text-shadow: none; } }
  .ui-btn { font: 500 13px/1.2 var(--sans); color: var(--ink); background: none; border: 1px solid var(--rule); border-radius: 2px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .ui-btn:hover { border-color: var(--ink-soft); }
  .ui-btn.fill { background: var(--ink); border-color: var(--ink); color: #2b2c2e; }
  .ui-btn.fill:hover { background: #fff; }
  .prog { height: 3px; background: var(--rule); }
  .prog i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .2s; }
  .count { font-variant-numeric: tabular-nums; color: var(--ink-soft); }

  .toc { display: none; }
  .toc-head { padding: 22px 0 16px; border-bottom: 1px solid var(--rule); }
  .toc-head .count { font-size: 13px; }
  .toc-head .prog { margin: 8px 0 10px; }
  .toc-now { margin: 0; font-size: 14px; line-height: 1.45; min-height: 2.9em; }
  .toc-now span { color: var(--ink-soft); }
  .toc-actions { display: flex; gap: 8px; margin-top: 12px; }
  .toc-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 6px 32px 0; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; overscroll-behavior: contain; }
  .proj { border-bottom: 1px solid rgba(109,111,114,.45); }
  .proj-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 13px 0; background: none; border: 0; color: var(--ink); font: 500 13px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; text-align: left; cursor: pointer; }
  .proj-btn .n { color: var(--ink-soft); font-weight: 400; letter-spacing: 0; }
  .proj-btn .chev { margin-left: auto; color: var(--ink-soft); transition: transform .15s; }
  .proj-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .proj-items { list-style: none; margin: 0 0 10px; padding: 0; }
  .item { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 8px 6px 10px; border-left: 2px solid transparent; text-decoration: none; color: var(--ink-soft); }
  .item:hover { background: rgba(255,255,255,.04); color: var(--ink); }
  .item[aria-current="true"] { border-left-color: var(--ink); background: rgba(255,255,255,.08); color: var(--ink); }
  .item img { display: block; width: 48px; height: 60px; object-fit: cover; background: var(--deep); }
  .item-t { display: block; font-size: 14px; line-height: 1.35; }
  .item-m { display: block; margin-top: 2px; font-size: 12px; line-height: 1.35; color: var(--ink-soft); }

  .topbar { position: fixed; z-index: 20; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 clamp(16px, 4vw, 40px); background: rgba(58,60,63,.97); border-bottom: 1px solid var(--rule); transform: translateY(-110%); transition: transform .2s; }
  .topbar[hidden] { display: none; }
  .topbar.on { transform: none; }
  .topbar .tb-now { flex: 1; min-width: 0; margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
  .topbar .count { margin-right: 10px; }
  .topbar .prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }

  .ov { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; overflow-y: auto; background: rgba(46,47,50,.98); color: var(--ink); overscroll-behavior: contain; }
  .ov::backdrop { background: transparent; }
  .ov-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 16px; padding: 12px clamp(16px, 4vw, 40px); background: rgba(46,47,50,.98); border-bottom: 1px solid var(--rule); }
  .ov-head h2 { margin: 0; font: 700 20px/1.3 var(--serif); }
  .ov-head .count { font-size: 14px; }
  .ov-head .ui-btn { margin-left: auto; }
  .ov-body { max-width: 1600px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 40px) 64px; }
  .ov-group + .ov-group { margin-top: 40px; }
  .ov-label { margin: 0 0 14px; font: 500 13px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; }
  .ov-label .n { color: var(--ink-soft); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
  .ov-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
  .ov-grid li { min-width: 0; }
  .ov-grid a { display: block; text-decoration: none; }
  .ov-grid img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; background: var(--deep); outline: 2px solid transparent; outline-offset: 2px; }
  .ov-grid a:hover img { outline-color: var(--ink-soft); }
  .ov-grid a[aria-current="true"] img { outline-color: var(--ink); }
  .ov-t { display: block; margin-top: 8px; font-size: 14px; line-height: 1.35; color: var(--ink); }
  .ov-m { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-soft); }

  @media (min-width: 1500px) {
    body.has-toc .wrap { max-width: calc(1200px + var(--tocw) + 32px); padding-left: calc(40px + var(--tocw) + 32px); }
    body.has-toc .layout { padding-left: 40px; display: grid; grid-template-columns: var(--tocw) minmax(0, 1fr); column-gap: 32px; align-items: start; }
    .toc:not([hidden]) { display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .topbar { display: none !important; }
  }

  @media (max-width: 760px) {
    .ov-grid { grid-template-columns: repeat(3, 1fr); gap: 16px 8px; }
    .ov-t { font-size: 12px; }
    .ov-m { display: none; }
    .wrap { padding-left: 16px; padding-right: 16px; }
    .intro { padding-top: 24px; padding-bottom: 48px; }
    .arc a + a { margin-top: 10px; }
    .note { margin-top: 80px; }
    .lb-title { display: none; }
    .lb-close { position: static; }
  }
</style>
</head>
<body>
<nav class="wrap back"><a href="../">← 컨셉아트 작업 목록</a></nav>

<header class="wrap intro">
  <h1 id="title">수작업 프로젝트</h1>
  <p id="intro">AI 없이 직접 그린 프로젝트 이미지입니다. 최신 작업부터 순서대로 모았습니다.</p>
  <div class="actions kji-actions">
    <a class="kji-btn kji-btn-fill" href="https://www.artstation.com/blueitems" target="_blank" rel="noopener">ArtStation <span class="arrow" aria-hidden="true">↗</span><span class="kji-sr">(새 창)</span></a>
    <a class="kji-btn kji-btn-line" href="../"><span class="arrow arrow-back" aria-hidden="true">←</span> 사이트 홈으로</a>
  </div>
</header>

<div class="wrap layout">
  <aside class="toc" id="toc" aria-label="작업 목차" hidden>
    <div class="toc-head">
      <div class="count" id="toc-count"></div>
      <div class="prog"><i id="toc-prog"></i></div>
      <p class="toc-now" id="toc-now"></p>
      <div class="toc-actions"><button type="button" class="ui-btn fill" data-ov aria-haspopup="dialog">전체 보기</button><button type="button" class="ui-btn" data-top>맨 위로</button></div>
    </div>
    <nav class="toc-list" id="toc-list" aria-label="프로젝트별 작업"></nav>
  </aside>
  <main id="archive" aria-label="수작업 이미지 목록">
    <p class="status" id="status">이미지를 불러오는 중…</p>
  </main>
</div>

<footer class="wrap note"><div class="rule"><p>모든 이미지는 직접 그린 작업입니다.</p><p>© 김종일</p></div></footer>
<nav class="wrap back bottom"><a href="../">← 컨셉아트 작업 목록</a><a href="https://kji.blueitems.net/">김종일 통합 포트폴리오 사이트</a></nav>

<div class="topbar" id="topbar" hidden>
  <p class="tb-now"><span class="count" id="tb-count"></span><span id="tb-now"></span></p>
  <button type="button" class="ui-btn" data-top aria-label="맨 위로">↑</button>
  <button type="button" class="ui-btn fill" data-ov aria-haspopup="dialog">목록</button>
  <div class="prog"><i id="tb-prog"></i></div>
</div>
<dialog class="ov" id="ov" aria-labelledby="ov-title">
  <div class="ov-head"><h2 id="ov-title">전체 작업</h2><span class="count" id="ov-count"></span><button type="button" class="ui-btn" id="ov-close">닫기</button></div>
  <div class="ov-body" id="ov-body"></div>
</dialog>

<dialog class="lb" id="lb" aria-label="크게 보기">
  <div class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <span class="lb-title" id="lb-title"></span>
    <button type="button" id="lb-prev" aria-label="이전 이미지">‹</button>
    <span class="lb-count" id="lb-count"></span>
    <button type="button" id="lb-next" aria-label="다음 이미지">›</button>
    <button type="button" class="lb-close" id="lb-close">닫기</button>
  </div>
</dialog>

<script>
(function () {
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // 갤러리 API를 그대로 읽음 → 관리자 갤러리에서 바꾸면 자동 반영
  var YEAR_RE = /\s*\b((?:19|20)\d{2})\s*$/;
  function splitYear(s) {
    s = (s || '').trim();
    var m = s.match(YEAR_RE);
    return m ? { name: s.slice(0, m.index).trim(), year: +m[1] } : { name: s, year: null };
  }
  function cld(cloud, id, t) { return 'https://res.cloudinary.com/' + cloud + '/image/upload/' + t + '/' + id; }

  function entries(g, conf) {
    var alias = conf.projectAlias || {}, est = conf.estimatedYears || {}, skip = conf.skipTitles || [];
    return (g.groups || []).map(function (grp) {
      var t = splitYear(grp.title), p = splitYear(grp.project);
      var project = alias[p.name] || p.name;
      var images = (grp.images || []).filter(function (i) { return i.visible !== false; }).map(function (i) { return i.imageId; });
      // 첫 장 = 관리자가 고른 썸네일 이미지, 나머지는 갤러리 순서
      var mainId = grp.thumbnail && images.indexOf(grp.thumbnail.imageId) >= 0 ? grp.thumbnail.imageId : images[0];
      var year = t.year || p.year;
      return {
        title: t.name, year: year, project: project, category: grp.category || '',
        sortYear: year || est[project] || 0, known: !!year, pos: grp.gridPosition || 0,
        crop: grp.thumbnail && grp.thumbnail.imageId === mainId ? grp.thumbnail.crop : null,
        ids: mainId ? [mainId].concat(images.filter(function (id) { return id !== mainId; })) : []
      };
    }).filter(function (e) { return e.title && skip.indexOf(e.title) < 0 && e.ids.length; })
      // 연도 최신순 → 같은 해는 실제 연도 우선 → 갤러리 순서
      .sort(function (a, b) { return (b.sortYear - a.sortYear) || (b.known - a.known) || (a.pos - b.pos); });
  }

  // 수동 위치 조정: "제목" 또는 "제목 · 분류" 로 찾아 move 를 after 바로 밑으로. 규칙 순서대로 적용
  function placeAfter(list, rules) {
    function find(key) {
      var k = key.split(' · '), title = k[0].trim(), cat = (k[1] || '').trim();
      for (var i = 0; i < list.length; i++) if (list[i].title === title && (!cat || list[i].category === cat)) return i;
      return -1;
    }
    (rules || []).forEach(function (r) {
      var from = find(r.move);
      if (from < 0 || find(r.after) < 0) return;
      var e = list.splice(from, 1)[0];
      list.splice(find(r.after) + 1, 0, e);
    });
    return list;
  }

  var lb = { set: [], i: 0, title: '' };
  var dlg = document.getElementById('lb');
  function lbShow() {
    var img = document.getElementById('lb-img');
    img.src = lb.set[lb.i].src; img.alt = lb.set[lb.i].alt;
    document.getElementById('lb-count').textContent = (lb.i + 1) + ' / ' + lb.set.length;
    document.getElementById('lb-title').textContent = lb.title;
    var one = lb.set.length < 2;
    document.getElementById('lb-prev').hidden = one; document.getElementById('lb-next').hidden = one;
  }
  function lbStep(d) { lb.i = (lb.i + d + lb.set.length) % lb.set.length; lbShow(); }
  function lbOpen(set, i, title) { lb.set = set; lb.i = i; lb.title = title; lbShow(); if (!dlg.open) dlg.showModal(); }
  document.getElementById('lb-prev').addEventListener('click', function () { lbStep(-1); });
  document.getElementById('lb-next').addEventListener('click', function () { lbStep(1); });
  document.getElementById('lb-close').addEventListener('click', function () { dlg.close(); });
  document.getElementById('lb-stage').addEventListener('click', function (e) { if (e.target.id === 'lb-stage') dlg.close(); });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); lbStep(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); lbStep(1); }
  });
  dlg.addEventListener('close', function () { document.getElementById('lb-img').removeAttribute('src'); });

  function render(list, cloud) {
    var box = document.getElementById('archive');
    box.textContent = '';
    list.forEach(function (e, n) {
      var alt = e.title + (e.year ? ' (' + e.year + ')' : '');
      var meta = [e.year, e.project, e.category].filter(Boolean).join(' · ');
      var set = e.ids.map(function (id, k) { return { src: cld(cloud, id, 'c_limit,w_2400,q_auto,f_auto'), alt: alt + ' ' + (k + 1) }; });
      var links = e.ids.map(function (id, k) {
        var img = el('img', {
          src: cld(cloud, id, 'c_limit,w_1600,q_auto,f_auto'),
          srcset: [800, 1200, 1600, 2400].map(function (w) { return cld(cloud, id, 'c_limit,w_' + w + ',q_auto,f_auto') + ' ' + w + 'w'; }).join(', '),
          sizes: '(max-width: 1200px) calc(100vw - 32px), 1120px',
          alt: set[k].alt, decoding: 'async', loading: n === 0 && k === 0 ? 'eager' : 'lazy'
        });
        var a = el('a', { href: set[k].src, 'aria-label': alt + ' ' + (k + 1) + '번째 크게 보기' }, [img]);
        a.addEventListener('click', function (ev) { ev.preventDefault(); lbOpen(set, k, alt); });
        return a;
      });
      box.appendChild(el('article', { class: 'arc', id: e.slug }, [
        el('header', { class: 'arc-head' }, [el('h2', { text: e.title }), meta ? el('p', { class: 'arc-meta', text: meta }) : null])
      ].concat(links)));
    });
  }

  // ---------- 썸네일 인덱스 ----------
  // 게시물마다 주소용 이름 (#rick-blood). 같은 제목은 -2, -3
  function addSlugs(list) {
    var seen = {};
    list.forEach(function (e) {
      var s = e.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'work';
      seen[s] = (seen[s] || 0) + 1;
      e.slug = seen[s] > 1 ? s + '-' + seen[s] : s;
    });
    return list;
  }

  var WIDE = window.matchMedia('(min-width: 1500px)');
  var MOBILE = window.matchMedia('(max-width: 760px)');
  var $ = function (id) { return document.getElementById(id); };
  var idx = {};             // slug → { e, n, g, row, ov }
  var projs = [];           // { name, items, btn, ul }
  var total = 0;
  var jumpFix = null;       // 이동 직후 위쪽 이미지가 늦게 로드돼 밀리는 것 보정

  // 도착 위치: 넓은 화면은 위 24px, 그 밖은 상단 바(48px) 아래
  function offset() { return WIDE.matches ? 24 : 72; }
  function articleTop(id) {
    var a = $(id);
    return a ? a.getBoundingClientRect().top + window.pageYOffset - offset() : null;
  }
  function stopFix() { if (jumpFix) { clearTimeout(jumpFix.timer); jumpFix.ro.disconnect(); jumpFix = null; } }
  function jumpTo(id, flash) {
    var y = articleTop(id);
    if (y == null) return;
    stopFix();
    window.scrollTo(0, y);
    var ro = new ResizeObserver(function () {
      var y2 = articleTop(id);
      if (y2 != null && Math.abs(window.pageYOffset - y2) > 2) window.scrollTo(0, y2);
    });
    ro.observe($('archive'));
    jumpFix = { ro: ro, timer: setTimeout(stopFix, 4000) };
    setActive(id);
    showBar(true);
    if (flash) { var a = $(id); a.classList.remove('flash'); void a.offsetWidth; a.classList.add('flash'); }
  }
  // 사용자가 직접 스크롤하면 보정 중단
  ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) {
    window.addEventListener(t, function (ev) {
      if (!jumpFix) return;
      if (ev.target.closest && ev.target.closest('.toc, .topbar, .ov')) return;
      stopFix();
    }, { passive: true });
  });

  function go(id) {
    // 뒤로가기로 이전 위치 복귀: 현재 위치를 기록해 두고 새 주소를 쌓음
    history.replaceState({ y: window.pageYOffset }, '');
    history.pushState({ id: id }, '', '#' + id);
    jumpTo(id, true);
  }
  window.addEventListener('popstate', function (ev) {
    stopFix();
    var s = ev.state || {};
    if (typeof s.y === 'number') window.scrollTo(0, s.y);
    else if (location.hash.length > 1) jumpTo(decodeURIComponent(location.hash.slice(1)), true);
  });
  function toTop() {
    stopFix();
    history.replaceState({ y: window.pageYOffset }, '');
    history.pushState({ y: 0 }, '', location.pathname + location.search);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---- 펼침: 현재 프로젝트만 자동으로 펼침. 직접 접은 건 프로젝트가 바뀔 때까지 존중
  function setOpen(p, open) {
    p.btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    p.ul.hidden = !open;
  }
  var activeId = null, activeG = -1;
  function setActive(id) {
    if (id === activeId || !idx[id]) return;
    if (activeId && idx[activeId]) { idx[activeId].row.removeAttribute('aria-current'); idx[activeId].ov.removeAttribute('aria-current'); }
    activeId = id;
    var it = idx[id];
    it.row.setAttribute('aria-current', 'true');
    it.ov.setAttribute('aria-current', 'true');
    if (it.g !== activeG) {
      activeG = it.g;
      projs.forEach(function (p, i) { setOpen(p, i === activeG); });
    }
    var pct = ((it.n + 1) / total * 100) + '%';
    var cnt = (it.n + 1) + ' / ' + total;
    $('toc-count').textContent = cnt; $('tb-count').textContent = cnt;
    $('toc-prog').style.width = pct; $('tb-prog').style.width = pct;
    var proj = projs[it.g].name;
    $('toc-now').textContent = '';
    $('toc-now').appendChild(el('span', { text: proj + ' · ' }));
    $('toc-now').appendChild(document.createTextNode(it.e.title));
    $('tb-now').textContent = proj + ' · ' + it.e.title;
    // 목차 안에서만 따라 움직여 현재 줄이 항상 보이게 (페이지는 건드리지 않음)
    if (WIDE.matches && !it.row.closest('[hidden]')) {
      var sc = $('toc-list'), r = it.row.getBoundingClientRect(), sr = sc.getBoundingClientRect();
      if (r.top < sr.top + 48 || r.bottom > sr.bottom - 48) sc.scrollTop += (r.top - sr.top) - sr.height / 2 + r.height / 2;
    }
  }

  // ---- 상단 바(넓은 화면 아님): 목록 시작 지점을 지나면 표시, 모바일은 내릴 때 숨고 올릴 때 나타남
  var bar = $('topbar'), lastY = 0;
  function showBar(force) {
    var past = $('archive').getBoundingClientRect().top < 0;
    var y = window.pageYOffset, dy = y - lastY;
    var on = past;
    if (past && MOBILE.matches && !force && !jumpFix) {
      if (Math.abs(dy) < 6) return;           // 작은 흔들림은 무시 (lastY 유지)
      on = dy < 0;
    }
    bar.classList.toggle('on', on);
    lastY = y;
  }
  window.addEventListener('scroll', function () { showBar(false); }, { passive: true });

  function thumbUrl(cloud, e, w, h) {
    var c = e.crop, t = 'c_fill,w_' + w + ',h_' + h + ',q_auto,f_auto';
    if (c && c.width > 0 && c.height > 0) t = 'c_crop,x_' + Math.round(c.x) + ',y_' + Math.round(c.y) + ',w_' + Math.round(c.width) + ',h_' + Math.round(c.height) + '/' + t;
    return cld(cloud, e.ids[0], t);
  }
  function metaOf(e) { return [e.year, e.category, e.ids.length + '장'].filter(Boolean).join(' · '); }

  var ov = $('ov');
  function openOv() {
    ov.showModal();
    var cur = activeId && idx[activeId].ov;
    if (cur) cur.scrollIntoView({ block: 'center' });
  }
  $('ov-close').addEventListener('click', function () { ov.close(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ov]'), function (b) { b.addEventListener('click', openOv); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-top]'), function (b) { b.addEventListener('click', toTop); });

  function buildIndex(list, cloud) {
    total = list.length;
    // 프로젝트별로 묶되, 묶음 순서와 묶음 안 순서는 페이지 순서(연도순) 그대로
    var at = {};
    list.forEach(function (e, n) {
      var k = e.project || '기타';
      if (!(k in at)) { at[k] = projs.length; projs.push({ name: k, items: [] }); }
      projs[at[k]].items.push(e);
      idx[e.slug] = { e: e, n: n, g: at[k] };
    });
    $('ov-count').textContent = total + '개 작업';

    projs.forEach(function (p, gi) {
      var ulId = 'proj-' + gi;
      p.btn = el('button', { type: 'button', class: 'proj-btn', 'aria-expanded': 'false', 'aria-controls': ulId }, [
        el('span', { text: p.name }), el('span', { class: 'n', text: '· ' + p.items.length }), el('span', { class: 'chev', 'aria-hidden': 'true', text: '▸' })
      ]);
      p.btn.addEventListener('click', function () {
        var open = p.btn.getAttribute('aria-expanded') === 'true';
        if (open) setOpen(p, false);
        else if (gi === activeG) setOpen(p, true);
        else go(p.items[0].slug);
      });
      p.ul = el('ul', { class: 'proj-items', id: ulId, hidden: '' });
      var grid = el('ul', { class: 'ov-grid' });
      p.items.forEach(function (e) {
        var row = el('a', { class: 'item', href: '#' + e.slug }, [
          el('img', { src: thumbUrl(cloud, e, 96, 120), alt: '', loading: 'lazy', decoding: 'async', width: '48', height: '60' }),
          el('span', null, [el('span', { class: 'item-t', text: e.title }), el('span', { class: 'item-m', text: metaOf(e) })])
        ]);
        row.addEventListener('click', function (ev) { ev.preventDefault(); go(e.slug); });
        p.ul.appendChild(el('li', null, [row]));
        var card = el('a', { href: '#' + e.slug }, [
          el('img', { src: thumbUrl(cloud, e, 300, 375), alt: '', loading: 'lazy', decoding: 'async', width: '150', height: '188' }),
          el('span', { class: 'ov-t', text: e.title }), el('span', { class: 'ov-m', text: metaOf(e) })
        ]);
        card.addEventListener('click', function (ev) { ev.preventDefault(); ov.close(); go(e.slug); });
        grid.appendChild(el('li', null, [card]));
        idx[e.slug].row = row; idx[e.slug].ov = card;
      });
      $('toc-list').appendChild(el('section', { class: 'proj' }, [p.btn, p.ul]));
      $('ov-body').appendChild(el('section', { class: 'ov-group' }, [
        el('h3', { class: 'ov-label' }, [document.createTextNode(p.name), el('span', { class: 'n', text: p.items.length })]), grid
      ]));
    });

    $('toc').hidden = false; bar.hidden = false;
    document.body.classList.add('has-toc');

    // 화면 위쪽 40% 지점에 걸린 게시물 = 현재 게시물
    var io = new IntersectionObserver(function (ents) {
      ents.forEach(function (en) { if (en.isIntersecting) setActive(en.target.id); });
    }, { rootMargin: '-40% 0px -59% 0px' });
    list.forEach(function (e) { io.observe($(e.slug)); });
    setActive(list[0].slug);

    var h = decodeURIComponent(location.hash.slice(1));
    if (h && idx[h]) jumpTo(h, true);
  }

  fetch('../works.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      var conf = d.manual || {};
      if (conf.title) document.getElementById('title').textContent = conf.title;
      if (conf.summary) document.getElementById('intro').textContent = conf.summary;
      return fetch(conf.galleryApi)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (g) {
          var list = addSlugs(placeAfter(entries(g, conf), conf.placeAfter)), cloud = g.cloudName || conf.cloudName;
          render(list, cloud);
          if (list.length) buildIndex(list, cloud);
        })
        .catch(function () { fail(conf); });
    })
    .catch(function () { fail(null); });
})();
</script>
<script src="../track.js" defer></script>
</body>
</html>
